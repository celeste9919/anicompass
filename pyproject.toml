[project]
name = "anicompass"
version = "0.0.1"
description = "AniCompass desktop anime recommendation and watch-list app."
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.1",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
  "pyinstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


